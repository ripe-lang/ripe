name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "**.txt"
      - ".gitignore"
      - "LICENSE-MIT"
      - "LICENSE-GPL"
      - ".editorconfig"
      - "docs/**"
      - "examples/**"
      - "todo/**"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ocaml/opam:ubuntu-24.04-ocaml-5.3
      options: --user root
      env:
        OPAMROOT: /home/opam/.opam
        OPAMROOTISOK: "1"
    defaults:
      run:
        working-directory: compiler
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update -y && apt-get install -y nodejs
      - uses: actions/cache@v4
        with:
          path: /home/opam/.opam
          key: opam-${{ hashFiles('compiler/ripe.opam.locked') }}
          restore-keys: opam-
      - run: opam install . --deps-only --locked --yes
      - run: opam exec -- dune build
      - run: opam exec -- dune build @fmt
      - run: opam exec -- dune runtest
