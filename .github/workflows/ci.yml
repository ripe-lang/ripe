name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.4
      - run: opam install . --deps-only --yes
      - run: opam install dune --yes
      - run: opam exec -- dune build
      - run: opam exec -- dune build @fmt
