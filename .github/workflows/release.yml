name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-ripe
      - run: opam exec -- dune build @install
      - run: opam exec -- dune runtest
      - run: python3 ci/package-linux-release.py "$GITHUB_REF_NAME"
      - run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz* --title "Ripe $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
