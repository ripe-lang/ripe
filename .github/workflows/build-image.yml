name: Build CI Image

on:
  workflow_call:
    outputs:
      tag:
        value: ${{ jobs.build.outputs.tag }}
  push:
    branches: [main]
    paths:
      - ripe.opam.locked
      - ci/Dockerfile
      - .github/workflows/build-image.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: |
          tag="${{ hashFiles('ripe.opam.locked', 'ci/Dockerfile') }}"
          test -n "$tag" || { echo "no files matched"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: existing
        run: |
          image="ghcr.io/${{ github.repository }}/ci:${{ steps.tag.outputs.tag }}"
          if docker manifest inspect "$image" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.existing.outputs.found == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ci/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/ci:${{ steps.tag.outputs.tag }}
